name: Testes da Vitrine Digital

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes de conteudo
        run: python -m unittest discover -s tests -v
      - name: Executar testes de estrutura
        run: python tests/estrutura.py
      - name: Validar JavaScript
        run: node --check js/main.js
      - name: Executar regressao de foco
        run: node tests/foco.cjs
